<main id="main-content" class="container my-5 py-5">
    <h1 class="fw-bold mb-4 text-center text-uppercase h2">Plaćanje i dostava</h1>

    <div class="row g-4 align-items-start">
            <div class="col-lg-7">
                <div class="card border-o shadow-sm p-4 rounded-4">
                    <h2 class=" h5 fw-bold mb-4">Podaci za dostavu </h2>
                    <form id="checkoutForm" onsubmit="event.preventDefault(); alert('Vaša porudzbina je uspesno kreirana!'); window.location.href='index.html';">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label small text-uppercase fw-semibold">Ime:</label>
                                <input type="text" class="form-control rounded-3" id="firstName" required aria-required="true">
                            </div>
                            <div class="col-sm-6">
                                <label for="lastName" class="form-label small text-uppercase fw-semibold">Prezime:</label>
                                <input type="text" class="form-control rounded-3" id="lasttName" required aria-required="true">
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label small text-uppercase fw-semibold">Vaša email adresa:</label>
                                <input type="email" class="form-control rounded-3" id="email" required aria-required="true">
                            </div>
                            <div class="col-12">
                                <label for="adress" class="form-label small text-uppercase fw-semibold">Vaša adresa i broj:</label>
                                <input type="text" class="form-control rounded-3" id="adress" required aria-required="true">
                            </div>
                            <div class="col-6">
                                <label for="city" class="form-label small text-uppercase fw-semibold">Grad:</label>
                                <input type="text" class="form-control rounded-3" id="city" required aria-required="true">
                            </div>
                            <div class="col-6">
                                <label for="zip" class="form-label small text-uppercase fw-semibold">Poštanski broj:</label>
                                <input type="zip" class="form-control rounded-3" id="zip" required aria-required="true">
                            </div>
                        </div>

                        <hr class="my-4">
                        <h2 class="h5 fw-bold mb-3">Način plaćanja:</h2>
                        <div class="form-check mb-2">
                            <input id="paymentPost" name="paymentMethod" type="radio" class="form-check-input" checked required>
                            <label class="from-check-label fw-semibold" for="paymentPost">Plaćanje pouzećem (gotovinom prilikom preuzimanja)</label>
                        </div>
                        <div class="form-check mb-4">
                            <input id="paymentCard" name="paymentMethod" type="radio" class="form-check-input" checked required>
                            <label class="from-check-label fw-semibold" for="paymentCard">Plaćanje platnom karticom</label>
                        </div>

                        <button class="btn btn-dark w-100 py-3 rounded-pill fw-semibold text-uppercase" type="submit" aria-label="Potvrdite porudžbinu">
                            Potvrdi i poruči
                        </button>
                    </form>
                </div>
            </div>

            <!--Pregled porudzbine-->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4 rounded-4 bg-light">
                    <h2 class="h5 fw-bold mb-3">Pregled porudzbine</h2>
                    <div id="checkoutCartItems" class="mb-3"></div>
                    <div class="d-flex justify-content-between align-items-center mb-2 small">
                        <span>Dostava:</span>
                        <span id="checkoutDeliveryText" class="fw-semibold">O RSD</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center fw-bold fs-5">
                        <span>Ukupno:</span>
                        <span id="checkoutTotalPrice"></span>
                    </div>

                </div>

            </div>

    </div>
</main>
</body>
