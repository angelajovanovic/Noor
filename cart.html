    <main class="container pt-5 mt-5 mb-5">
    <h1 class="h2 fw-bold text-uppercase tracking-wider mb-4">Vaša Korpa</h1>

        <div class="row g-4">
      <!-- Levo: artikli-->
      <div class="col-lg-8">
        <div id="cartStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="cartItemsContainer"></div>
      </div>

      <!-- Desno: sazetak i placanje -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm p-4 rounded-4 bg-light">
          <h5 class="fw-bold text-uppercase mb-4">Pregled porudžbine</h5>
          
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Proizvodi: </span>
            <span id="subtotalPrice" class="fw-semibold">0 RSD</span>
          </div>
          
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Dostava: </span>
            <span class="text-success fw-semibold"> Besplatna za porudžbine preko 12.000 RSD </span>
          </div>

          <hr class="my-3">

          <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
            <span>Ukupno: </span>
            <span id="totalPrice">0 RSD</span>
          </div>

          <button class="btn btn-dark w-100 rounded-pill py-3 fw-semibold text-uppercase tracking-wider">
            Nastavi na plaćanje
          </button>

          <p class="text-muted small text-center mt-3 mb-0">
            <i class="bi bi-shield-check me-1"></i> Sigurna kupovina i besplatan povrat u roku od 14 dana
          </p>
